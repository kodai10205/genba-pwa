<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>現場管理</title>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#e8710a"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="現場管理">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--sub:#667085;--ac:#e8710a;--bd:#dde1e8;--ok:#1a8f4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1f242d;--tx:#eceff4;--sub:#9aa3b2;--bd:#323946;--ac:#ff9a3d;--ok:#4cc57f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1f242d;--tx:#eceff4;--sub:#9aa3b2;--bd:#323946;--ac:#ff9a3d;--ok:#4cc57f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:40px}
.w{max-width:640px;margin:0 auto;padding:10px}
.bar{display:flex;gap:6px;align-items:center}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
select.site{flex:1;font-weight:700}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.tabs{display:flex;margin:10px 0;gap:4px}.tabs button{flex:1;padding:10px 2px;font-weight:700}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;margin:8px 0}.chips button{padding:4px 12px;border-radius:20px}.chips button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.add{display:grid;grid-template-columns:1fr 70px 56px auto;gap:6px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0}
.r{display:flex;gap:6px;align-items:center;margin-top:6px}.r:first-child{margin-top:0}
.nm{flex:1;font-weight:700}.q{width:64px;text-align:center}.u{width:56px}.nt{flex:1}
.st{width:42px;padding:8px 0}.x{color:#d33;padding:8px 10px}
.tag{font-size:12px;color:var(--sub)}.done .nm{text-decoration:line-through;color:var(--sub)}
.s0{color:#d33}.s1{color:var(--ac)}.s2{color:var(--ok)}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.tb{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}.tb th,.tb td{border:1px solid var(--bd);padding:6px;text-align:left;white-space:nowrap}.tb th{background:var(--bg);color:var(--sub)}.hd{margin:16px 0 6px;font-size:16px;color:var(--ac);cursor:pointer}
#dlg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#dlg .b{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:360px}#dlg input{width:100%;margin:10px 0}#dlg .bt{display:flex;gap:8px;margin-top:10px}#dlg .bt button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
#ov{position:fixed;inset:0;background:#0008;display:none;padding:16px;z-index:9}#ov div{background:var(--card);border-radius:12px;padding:12px;max-width:600px;margin:auto}#ov textarea{width:100%;height:50vh;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px}
</style></head><body><div class="w">
<div class="bar"><select id="site" class="site"></select><button id="ns">＋現場</button><button id="rn">名称</button><button id="ds">削除</button></div>
<div class="tabs" id="tabs"></div>
<input id="q" placeholder="検索" style="width:100%">
<div id="chips"></div>
<div class="add" id="addf"><input id="an" placeholder="品名"><input id="aq" type="number" inputmode="decimal" placeholder="数量"><input id="au" placeholder="単位"><button class="p" id="ab">追加</button></div>
<div id="list"></div>
<div class="top"><span class="tag">端末内に自動保存されます</span><span><button id="cp">共有用テキスト</button> <button id="ex">書き出し</button> <button id="im">読み込み</button></span></div>
</div>
<div id="dlg"><div class="b"><div id="dm" style="font-weight:700"></div><input id="di"><div class="bt"><button id="dno">キャンセル</button><button id="dok" class="p">OK</button></div></div></div>
<div id="ov"><div><p id="ovm" style="margin:0 0 8px"></p><textarea id="ot" readonly></textarea><button id="oi" class="p" style="margin-top:8px;width:100%;display:none">この内容を取り込む（現在のデータは置き換わります）</button><button id="oc" style="margin-top:8px;width:100%">閉じる</button></div></div>
<script>
const K='genba-v1',TABS=[['all','一覧'],['stock','現場在庫'],['orders','発注'],['next','次回準備']],ST=['未発注','発注済','納品済'];
const uid=()=>Math.random().toString(36).slice(2,9);
function ask(msg,o){o=o||{};return new Promise(res=>{
 const inp=document.getElementById('di'),ok=document.getElementById('dok'),no=document.getElementById('dno'),dl=document.getElementById('dlg');
 document.getElementById('dm').textContent=msg;inp.style.display=o.input?'block':'none';inp.value=o.def||'';no.style.display=o.alert?'none':'';dl.style.display='flex';if(o.input)inp.focus();
 const done=v=>{dl.style.display='none';res(v)};
 ok.onclick=()=>done(o.input?inp.value.trim():true);no.onclick=()=>done(o.input?null:false);
 inp.onkeydown=e=>{if(e.key==='Enter')ok.click()};
})}
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.sites||!S.sites.length)S={sites:[{id:uid(),name:'現場A',stock:[],orders:[],next:[]}],cur:null,tab:'stock'};
if(!S.sites.find(s=>s.id===S.cur))S.cur=S.sites[0].id;
S.tab='all';
let flt='全て',srt='';
const srtd=a=>{if(!srt)return a;const c=(x,y)=>String(x).localeCompare(String(y),'ja'),r=t=>t==='工具'?0:1;return a.slice().sort((x,y)=>srt==='type'?(r(x.type)-r(y.type))||c(x.name,y.name):c(x.name,y.name))};
const SC=()=>`<div class="chips"><span class="tag" style="align-self:center">在庫の並び替え</span>${[['','登録順'],['type','工具・材料順'],['name','品名順']].map(c=>`<button data-s="${c[0]}" class="${srt===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>`;
const $=i=>document.getElementById(i);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cs=()=>S.sites.find(s=>s.id===S.cur);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 $('site').innerHTML=S.sites.map(s=>`<option value="${s.id}" ${s.id===S.cur?'selected':''}>${esc(s.name)}</option>`).join('');
 const s=cs();
 $('tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}${t[0]==='all'?'':' ('+s[t[0]].length+')'}</button>`).join('');
 $('chips').innerHTML=S.tab==='stock'?`<div class="chips">${['全て','材料','工具'].map(c=>`<button data-c="${c}" class="${flt===c?'on':''}">${c}</button>`).join('')}</div>`+SC():S.tab==='all'?SC():'';
 $('addf').style.display=S.tab==='all'?'none':'';$('q').style.display=S.tab==='all'?'none':'';
 if(S.tab==='all'){
  const tb=(h,rs)=>`<div style="overflow-x:auto"><table class="tb"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rs.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="tag">なし</td></tr>`}</table></div>`;
  const q=i=>i.qty+(i.unit||'');
  $('list').innerHTML=`<h3 class="hd" data-go="stock">現場在庫 (${s.stock.length}) ›</h3>`+tb(['品名','数量','種別','メモ'],srtd(s.stock).map(i=>[i.name,q(i),i.type,i.note||'']))+`<h3 class="hd" data-go="orders">発注 (${s.orders.length}) ›</h3>`+tb(['品名','数量','状態','納期','メモ'],s.orders.map(i=>[i.name,q(i),ST[i.st],i.due||'',i.note||'']))+`<h3 class="hd" data-go="next">次回準備 (${s.next.length}) ›</h3>`+tb(['品名','数量','準備','メモ'],s.next.map(i=>[i.name,q(i),i.done?'済':'未',i.note||'']));
  return;
 }
 const kw=$('q').value.trim();
 let items=s[S.tab].filter(i=>(!kw||(i.name+(i.note||'')).includes(kw))&&(S.tab!=='stock'||flt==='全て'||i.type===flt));
 if(S.tab==='stock')items=srtd(items);
 $('list').innerHTML=items.length?items.map(row).join(''):'<div class="empty">まだありません。上のフォームから追加</div>';
}
function row(i){
 const t=S.tab;let ex='';
 if(t==='stock')ex=`<select data-f="type" data-id="${i.id}"><option ${i.type==='材料'?'selected':''}>材料</option><option ${i.type==='工具'?'selected':''}>工具</option></select>`;
 if(t==='orders')ex=`<button data-a="st" data-id="${i.id}" class="s${i.st}">${ST[i.st]}</button><input type="date" data-f="due" data-id="${i.id}" value="${esc(i.due||'')}">${i.st===2?`<button data-a="mv" data-id="${i.id}">在庫へ</button>`:''}`;
 if(t==='next')ex=`<button data-a="dn" data-id="${i.id}">${i.done?'☑ 準備済':'☐ 未準備'}</button>`;
 return `<div class="card ${i.done?'done':''}"><div class="r"><input class="nm" data-f="name" data-id="${i.id}" value="${esc(i.name)}"><button class="x" data-a="del" data-id="${i.id}">✕</button></div>
 <div class="r"><button class="st" data-a="dec" data-id="${i.id}">−</button><input class="q" type="number" inputmode="decimal" data-f="qty" data-id="${i.id}" value="${esc(i.qty)}"><button class="st" data-a="inc" data-id="${i.id}">＋</button><input class="u" data-f="unit" data-id="${i.id}" value="${esc(i.unit)}" placeholder="単位">${ex}</div>
 <div class="r"><input class="nt" data-f="note" data-id="${i.id}" value="${esc(i.note||'')}" placeholder="メモ（置き場所・規格など）"></div><div class="r">${[['stock','在庫'],['orders','発注'],['next','次回準備']].filter(x=>x[0]!==t).map(x=>`<button data-a="mvto" data-to="${x[0]}" data-id="${i.id}">→ ${x[1]}へ</button>`).join('')}</div></div>`;
}
const find=id=>cs()[S.tab].find(i=>i.id===id);
$('list').addEventListener('input',e=>{const d=e.target.dataset;if(!d.f)return;const i=find(d.id);if(i){i[d.f]=d.f==='qty'?(e.target.value===''?0:+e.target.value):e.target.value;save()}});
$('list').addEventListener('change',e=>{if(e.target.dataset.f==='type')render()});
$('list').addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){S.tab=g.dataset.go;save();render();return}
 const b=e.target.closest('[data-a]');if(!b)return;const s=cs(),i=find(b.dataset.id);if(!i)return;const a=b.dataset.a;
 if(a==='inc')i.qty=Math.round((+i.qty+1)*100)/100;
 if(a==='dec')i.qty=Math.max(0,Math.round((+i.qty-1)*100)/100);
 if(a==='del'){const t=S.tab;ask('「'+i.name+'」を削除しますか？').then(ok=>{if(ok){s[t]=s[t].filter(x=>x!==i);save();render()}});return}
 if(a==='mvto'){const k=b.dataset.to,n={id:uid(),name:i.name,qty:i.qty,unit:i.unit,note:i.note||''};if(k==='stock')n.type=i.type||'材料';if(k==='orders'){n.st=0;n.due=''}if(k==='next')n.done=false;s[k].unshift(n);s[S.tab]=s[S.tab].filter(x=>x!==i)}
 if(a==='st')i.st=(i.st+1)%3;
 if(a==='dn')i.done=!i.done;
 if(a==='mv'){const m=s.stock.find(x=>x.name===i.name&&x.unit===i.unit);if(m)m.qty=+m.qty+ +i.qty;else s.stock.unshift({id:uid(),name:i.name,qty:i.qty,unit:i.unit,note:i.note,type:'材料'});s.orders=s.orders.filter(x=>x!==i)}
 save();render();
});
$('ab').onclick=()=>{
 const n=$('an').value.trim();if(!n)return $('an').focus();
 const it={id:uid(),name:n,qty:+$('aq').value||1,unit:$('au').value.trim(),note:''};
 if(S.tab==='stock')it.type=flt==='工具'?'工具':'材料';if(S.tab==='orders'){it.st=0;it.due=''}if(S.tab==='next')it.done=false;
 cs()[S.tab].unshift(it);$('an').value='';$('aq').value='';save();render();$('an').focus();
};
$('an').addEventListener('keydown',e=>{if(e.key==='Enter')$('ab').click()});
$('tabs').onclick=e=>{const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;save();render()}};
$('chips').onclick=e=>{const c=e.target.closest('[data-c]'),b=e.target.closest('[data-s]');if(c){flt=c.dataset.c;render()}if(b){srt=b.dataset.s;render()}};
$('q').oninput=render;
$('site').onchange=e=>{S.cur=e.target.value;save();render()};
$('ns').onclick=()=>ask('新しい現場名',{input:1}).then(n=>{if(n){const s={id:uid(),name:n,stock:[],orders:[],next:[]};S.sites.push(s);S.cur=s.id;save();render()}});
$('rn').onclick=()=>ask('現場名を変更',{input:1,def:cs().name}).then(n=>{if(n){cs().name=n;save();render()}});
$('ds').onclick=()=>{if(S.sites.length<2)return ask('最後の現場は削除できません',{alert:1});ask('「'+cs().name+'」とそのデータをすべて削除しますか？').then(ok=>{if(ok){S.sites=S.sites.filter(s=>s.id!==S.cur);S.cur=S.sites[0].id;save();render()}})};
$('cp').onclick=()=>{
 const s=cs(),f=i=>`・${i.name} ${i.qty}${i.unit||''}${i.note?'（'+i.note+'）':''}`;
 const t=`【${s.name}】\n■在庫\n${s.stock.map(f).join('\n')||'なし'}\n\n■発注\n${s.orders.map(i=>f(i)+' ['+ST[i.st]+(i.due?' '+i.due:'')+']').join('\n')||'なし'}\n\n■次回準備\n${s.next.map(i=>(i.done?'☑':'☐')+f(i).slice(1)).join('\n')||'なし'}`;
 $('ot').value=t;$('ot').readOnly=true;$('oi').style.display='none';$('ovm').textContent='全選択してコピーし、LINEなどに貼り付けできます';$('ov').style.display='block';$('ot').focus();$('ot').select();
 try{navigator.clipboard.writeText(t).then(()=>$('ovm').textContent='コピーしました')}catch(e){}
};
$('oc').onclick=()=>$('ov').style.display='none';
$('ex').onclick=()=>{const t=JSON.stringify(S);$('ot').readOnly=true;$('ot').value=t;$('oi').style.display='none';$('ovm').textContent='全選択してコピーし、新しいアプリの「読み込み」に貼り付けてください';$('ov').style.display='block';$('ot').focus();$('ot').select();try{navigator.clipboard.writeText(t).then(()=>$('ovm').textContent='コピーしました。新しいアプリの「読み込み」に貼り付けてください')}catch(e){}};
$('im').onclick=()=>{$('ot').readOnly=false;$('ot').value='';$('oi').style.display='block';$('ovm').textContent='書き出したテキストを貼り付けてください';$('ov').style.display='block';$('ot').focus()};
$('oi').onclick=()=>{try{const d=JSON.parse($('ot').value);if(!d.sites||!d.sites.length)throw 0;S=d;if(!S.sites.find(s=>s.id===S.cur))S.cur=S.sites[0].id;S.tab='all';save();$('ov').style.display='none';render()}catch(e){$('ovm').textContent='読み込めませんでした。書き出したテキスト全体を貼り付けてください'}};
render();
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
